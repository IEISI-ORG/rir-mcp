packages:
  - "packages/*"
allowBuilds:
  esbuild: true
  workerd: true
# Supply-chain hygiene (audit 2026-10-05): never install a package version published less than 3 days ago, so a
# compromised release is likely caught and pulled before it can reach this repository.
minimumReleaseAge: 4320
# Exact versions already installed and in use before the policy was added (published 2026-10-02/03). Remove these
# lines once they are older than the cutoff (after 2026-10-07); any other or newer version still waits 3 days.
minimumReleaseAgeExclude:
  - wrangler@4.147.0
  - "@cloudflare/vitest-plugin@1.3.6"
  - mdast-util-from-markdown@2.1.0
  - mdast-util-to-markdown@2.2.0
